<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SolveMate — visit our website and demo</title>
  <meta name="description" content="SolveMate's website and interactive demo now live together at vitapilotai.com." />
  <link rel="canonical" href="https://vitapilotai.com/" />
  <meta name="robots" content="noindex, follow" />
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #15171c; background: #f6f6f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { max-width: 560px; padding: 40px; border: 1px solid #e3e3de; border-radius: 24px; background: white; }
    .brand { margin: 0 0 20px; font-size: 14px; font-weight: 650; color: #0e6b61; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; letter-spacing: -.025em; }
    p { color: #5a606c; line-height: 1.65; }
    a { display: inline-block; margin-top: 8px; padding: 13px 20px; border-radius: 999px; background: #0e6b61; color: white; font-weight: 600; text-decoration: none; }
    a:hover { background: #0a5249; }
    a:focus-visible { outline: 3px solid #3f5bd9; outline-offset: 4px; }
    .note { margin-bottom: 0; font-size: 13px; }
    @media (max-width: 420px) { main { padding: 28px 24px; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">SolveMate by VitaPilot AI</p>
    <h1>One place to explore SolveMate.</h1>
    <p>Our website and interactive demo now live together. Learn how SolveMate connects companies and individuals with experts, then try the demo.</p>
    <a href="https://vitapilotai.com/">Visit SolveMate and the demo →</a>
    <p class="note">If you aren't redirected automatically, use the link above.</p>
  </main>
  <script>
    // Publish this retirement page only after vitapilotai.com serves the Next.js app.
    // The guard prevents a redirect loop if the old custom domain still points here.
    if (location.hostname !== "vitapilotai.com" && location.hostname !== "www.vitapilotai.com" && location.protocol === "https:") {
      location.replace("https://vitapilotai.com/");
    }
  </script>
</body>
</html>
